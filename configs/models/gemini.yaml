# Model registry: one file per model. Secrets ONLY via env (never committed).
# Cheapest way to test: Google AI Studio key (free tier available, then PAYG).
# Get one at https://aistudio.google.com/apikey — export GEMINI_API_KEY.
id: gemini
display_name: Gemini (AI Studio, OpenAI-compatible)
adapter: openai-compatible
base_url: https://generativelanguage.googleapis.com/v1beta/openai
base_url_env: GEMINI_BASE_URL
api_key_env: GEMINI_API_KEY
model_env: GEMINI_MODEL
model: gemini-2.5-flash
# Ask the model for exactly one candidate-list name.
max_output_tokens: 2000
token_param: max_tokens
reasoning_api: none  # unverified on this endpoint; effort flags ignored
# temperature omitted (provider default)
# Pricing in USD per 1k tokens (no per-request fee).
# Indicative Gemini 2.5 Flash rates, retrieved 2026-09-10 — VERIFY against
# https://ai.google.dev/pricing before any large run. Used ONLY for --max-cost.
price_per_1k_requests: 0.0
price_input_1k_tokens: 0.0003
price_cached_1k_tokens: 0.00003
price_output_1k_tokens: 0.0025
# Runner limits.
timeout_s: 180
max_tasks_default: 10
notes: Cheapest entry: AI Studio free tier (rate-limited), then PAYG above.
