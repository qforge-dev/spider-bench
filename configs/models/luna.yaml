id: luna
display_name: Luna (vision)
adapter: openai-compatible
base_url: https://ps-mp2xfc81-eastus2.openai.azure.com/openai/v1
base_url_env: LUNA_BASE_URL
api_key_env: LUNA_API_KEY
model_env: LUNA_MODEL
model: gpt-5.6-luna
structured_output: false
reasoning_effort: medium
max_output_tokens: 2000
token_param: max_completion_tokens
# temperature omitted: GPT-5-class models only accept the default (1)
# Pricing in USD per 1k tokens (no per-request fee on Azure/OpenAI).
# Source: CloudPrice GPT-5.6 versions table, retrieved 2026-09-09
# (GPT-5.6 Luna: $0.200/1M in, $1.20/1M out). Confirm against your
# Azure contract; override via re-edit. Used ONLY for --max-cost guards.
price_per_1k_requests: 0.0
price_input_1k_tokens: 0.0002
price_cached_1k_tokens: 0.00002
price_output_1k_tokens: 0.0012
timeout_s: 120
max_tasks_default: 100
notes: Pricing 2026-09-09, verify against Azure contract before big runs.
