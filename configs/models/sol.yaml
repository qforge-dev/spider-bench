# Model registry: one file per model. Secrets ONLY via env (never committed).
id: sol
display_name: Sol (vision)
adapter: openai-compatible
# Set your own endpoint and credentials through the variables below.
base_url_env: SOL_BASE_URL
api_key_env: SOL_API_KEY
model_env: SOL_MODEL
model: gpt-5.6-sol
# Ask the model for exactly one candidate-list name.
structured_output: false
reasoning_effort: medium
max_output_tokens: 16000
token_param: max_completion_tokens
# temperature omitted: GPT-5-class models only accept the default (1)
# Pricing in USD per 1k tokens (no per-request fee on Azure/OpenAI).
# Source: https://developers.openai.com/api/docs/models/gpt-5.6-sol
# OpenAI standard short-context rates, verified 2026-09-10:
# $4.00/1M input, $0.40/1M cached input, $20.00/1M output including reasoning.
# Reference estimates for --max-cost; actual Azure contract rates may differ.
# The $2/$10 rates apply to Batch/Flex, not standard synchronous requests.
price_per_1k_requests: 0.0
price_input_1k_tokens: 0.004
price_cached_1k_tokens: 0.0004
price_output_1k_tokens: 0.02
# Runner limits.
timeout_s: 120
max_tasks_default: 100
notes: OpenAI standard pricing reference verified 2026-09-10; actual Azure contract rates may differ.
