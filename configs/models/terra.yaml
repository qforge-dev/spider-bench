# Model registry: one file per model. Secrets ONLY via env (never committed).
# Copy this template for a new model.
id: terra
display_name: Terra (vision)
adapter: openai-compatible
# Endpoint + credentials (env names; values never touch disk/logs).
base_url: https://ps-mp2xfc81-eastus2.openai.azure.com/openai/v1
base_url_env: TERRA_BASE_URL
api_key_env: TERRA_API_KEY
model_env: TERRA_MODEL              # default below
model: gpt-5.6-terra
# Ask the model for exactly one candidate-list name.
structured_output: false
reasoning_effort: medium
max_output_tokens: 2000
token_param: max_completion_tokens
# temperature omitted: GPT-5-class models only accept the default (1)
# Pricing in USD per 1k tokens (no per-request fee on Azure/OpenAI).
# Source: CloudPrice GPT-5.6 versions table, retrieved 2026-09-09
# (GPT-5.6 Terra: $2.00/1M in, $12.00/1M out). Confirm against your
# Azure contract; override via re-edit. Used ONLY for --max-cost guards.
price_per_1k_requests: 0.0
price_input_1k_tokens: 0.002
price_cached_1k_tokens: 0.0005
price_output_1k_tokens: 0.012
# Runner limits.
timeout_s: 120
max_tasks_default: 100
notes: Placeholder values — confirm model name + pricing before any paid run.
