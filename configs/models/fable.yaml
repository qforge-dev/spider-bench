# Model registry: one file per model. Secrets ONLY via env (never committed).
# AWS auth uses the standard chain (env AWS_ACCESS_KEY_ID / SSO / IAM role).
id: fable
display_name: Fable (Bedrock)
adapter: bedrock-converse
# Region + model id (env overrides; values never touch disk/logs).
region_env: FABLE_REGION
region: us-east-1
model_env: FABLE_MODEL
model: fable                  # <-- exact Bedrock model ID (check console if calls fail)
# Ask the model for exactly one candidate-list name.
max_output_tokens: 2000
# temperature omitted: reasoning-class models only accept the default
# Pricing in USD per 1k tokens (Bedrock has no per-request fee).
# Fable pricing unconfirmed — fill from your AWS bill/A Bedrock pricing page.
# Used ONLY for --max-cost guards.
price_per_1k_requests: 0.0
price_input_1k_tokens: 0.0
price_output_1k_tokens: 0.0
# Runner limits.
timeout_s: 180
max_tasks_default: 10
notes: Pricing unknown — set before any large run or --max-cost is meaningless.
