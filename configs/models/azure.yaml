# Azure OpenAI: OpenAI-compatible chat-completions behind a deployment URL.
# Fill the three placeholders, export the key, run (see bottom).
id: azure
display_name: Azure OpenAI (vision deployment)
adapter: openai-compatible
# e.g. https://YOUR-RESOURCE.openai.azure.com/openai/deployments/YOUR-DEPLOYMENT
base_url: https://ps-mp2xfc81-eastus2.openai.azure.com/openai/v1
base_url_env: AZURE_OPENAI_ENDPOINT
api_key_env: AZURE_OPENAI_API_KEY
model_env: AZURE_OPENAI_DEPLOYMENT
model: your-deployment-name         # <-- must equal the deployment name
api_version: "2024-10-21"           # <-- set a version your resource supports
max_output_tokens: 2000
temperature: 0.0
price_per_1k_requests: 0.01         # <-- fill from your Azure pricing
price_input_1k_tokens: 0.005
price_output_1k_tokens: 0.015
timeout_s: 120
max_tasks_default: 10
notes: Azure appends ?api-version automatically from api_version above.
