<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polish spiders — search</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>Polish spiders <small>{{ rows|length }} / {{ total }} shown</small></h1>
  <form method="get" class="filters">
    <input type="search" name="q" placeholder="Search species…" value="{{ q }}">
    <select name="family">
      <option value="">All families</option>
      {% for f in families %}
      <option value="{{ f }}" {% if f == family %}selected{% endif %}>{{ f }}</option>
      {% endfor %}
    </select>
    <select name="image">
      <option value="all" {% if image == 'all' %}selected{% endif %}>With + without images</option>
      <option value="with" {% if image == 'with' %}selected{% endif %}>With image</option>
      <option value="without" {% if image == 'without' %}selected{% endif %}>Without image</option>
    </select>
    <select name="danger">
      <option value="">Any danger status</option>
      {% for c in ['none_known','minor_local_effects','medically_significant','uncertain','not_assessed'] %}
      <option value="{{ c }}" {% if c == danger %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
    <button type="submit">Search</button>
  </form>
</header>
<main class="grid">
  {% for r in rows %}
  <a class="card" href="{{ url_for('detail', name=r.taxon) }}">
    {% if r.thumb %}<img loading="lazy" src="{{ r.thumb }}" alt="{{ r.taxon }}">{% else %}<div class="noimg">no image</div>{% endif %}
    <div class="meta"><strong><i>{{ r.taxon }}</i></strong><span>{{ r.family }} · {{ r.danger }}</span></div>
  </a>
  {% endfor %}
</main>
</body>
</html>
